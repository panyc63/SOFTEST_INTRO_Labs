name: .NET build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "Lab 3/SOFTEST_INTRO_Labs/SOFTEST_INTRO_Labs.sln"

      - name: Build solution
        run: dotnet build "Lab 3/SOFTEST_INTRO_Labs/SOFTEST_INTRO_Labs.sln" --configuration Release --no-restore

      - name: Run all tests
        run: dotnet test "Lab 3/SOFTEST_INTRO_Labs/SOFTEST_INTRO_Labs.sln" --configuration Release --no-build --verbosity normal